[general]

# live_config_reload = true

[env]
TERM = "xterm-256color"

[window]
decorations = "buttonless"
dynamic_padding = false
opacity = 0.9

[window.padding]
x = 15
y = 15

[font]
size = 17.0

[font.bold]
family = "CaskaydiaCove Nerd Font"
style = "Heavy"

[font.bold_italic]
family = "CaskaydiaCove Nerd Font"
style = "Heavy Italic"

[font.italic]
family = "CaskaydiaCove Nerd Font"
style = "Medium Italic"

[font.normal]
family = "CaskaydiaCove Nerd Font"
style = "Medium"
