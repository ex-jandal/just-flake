# setw -g pane-active-border-style  "bg=#{@ctp_crust},fg=#{@ctp_surface_1}"
# setw -g pane-border-style         "bg=default,fg=#{@ctp_surface_0}"


# -------------------------
# Separators
# -------------------------
# Separator between windows (empty so segments are adjacent)
set -g window-status-separator " • "

set -g display-panes-time 2000  # How long to show pane numbers (ms)
# set -g display-panes-colour "#{@ctp_yellow}"
# set -g display-panes-active-colour "#{@ctp_red}"
bind-key -n M-q display-panes  # Alt+q to show numbers

# bind / run-shell 'tmux-fzf-session'

set -g automatic-rename on
set -g automatic-rename-format "#{pane_current_command}:#{pane_current_path}"

set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'  # save every 10 minutes

# bind f display-popup -E -w 90% -h 80% -T "Files" 'yazi'  # or nnn, lf, ranger

bind -n M-g split-window -v -c "#{pane_current_path}" 'lazygit'
bind -n M-p split-window -h -c "#{pane_current_path}" 'btop'
