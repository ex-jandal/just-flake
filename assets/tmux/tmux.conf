set -g @ctp_pink         "#00b4d8"  # A deep vivid Sky Blue

# -------------------------
# Global status bar — transparent background (bg=default), colored text only
# -------------------------
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default fg=#{@ctp_fg}"

# -------------------------
# Left side (command + cwd)
# -------------------------
set -g status-left-length 100
set -g status-left ""

# -------------------------
# Right side (mode + session)
# -------------------------
set -g status-right-length 100
set -g status-right ""

# Current command segment
set -ga status-right "#[fg=#{@ctp_cyan}] 󰅴 #{pane_current_command}"

# Path segment (commented, keep config parity)
# set -ga status-right "#[fg=#{@ctp_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}}"

# Mode indicator (prefix/copy/normal) — transparent, text colored by mode
set -ga status-right "#[fg=#{@ctp_green}] #{?client_prefix,PREFIX,#{?#{==:#{pane_mode},copy-mode},COPY,NORMAL}}"

# Session name
set -ga status-right "#[fg=#{@ctp_red}]  #S"


# -------------------------
# Window titles
# -------------------------
# Inactive window format
set -g window-status-format \
"#[fg=#{@ctp_pink},bg=default]  #I#{?#{!=},: #W,} "

# Active window format
set -g window-status-current-format \
"#[fg=#{@ctp_yellow},bg=default,bold]  #I#{?#{!=},: #W,} #{?window_last_flag,,} "


# set -g status-right '#(~/scripts/tmux-current-app.sh) | #{=/-32/...:#{s|$HOME|~|:#{pane_current_path}}} | #S '

# Bell style (optional)
set -g window-status-bell-style "fg=#{@ctp_crust},bg=#{@ctp_blue},bold"


# Center window titles
set -g status-justify left

set -g status 2
set -g status-format[1] ""

# -------------------------
# Pane border styles (optional)
# -------------------------
setw -g pane-border-style          "fg=#{@ctp_surface_0}"
setw -g pane-active-border-style   "fg=#{@ctp_blue}"

